<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome page</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <input type="checkbox" id="theme-toggle" class="theme-toggle-checkbox" aria-label="theme toggle">

  <div class="page-container main-page-container">
    <header class="top-bar">
      <div class="brand">
        <img src="images/logo.png.webp" alt="logo" class="brand-logo">
        <span class="brand-name">Friendzone</span>
      </div>

      <label for="theme-toggle" class="theme-toggle-button">
        <span class="theme-option light-opt">☀️ Light</span>
        <span class="theme-option dark-opt">🌙 Dark</span>
      </label>
    </header>

    <main id="main-content" class="main">
      <div class="main-wrapper">
        <h1 class="main-title">Meet people who share what matters to you</h1>
        <p class="main-description">Real people near you, matched on interests, values, and mutual goals.</p>

        <div class="actions">
          <a href="sign-up.html" class="button button-primary action-main">Create your profile</a>
          <a href="#" class="button button-secondary action-login">Log in</a>
        </div>

        <p class="subtext">Free to join • Get ready to meet</p>

        <div class="features">
          <span>Smart matching</span>
          <span class="dot">•</span>
          <span>Local connections</span>
          <span class="dot">•</span>
          <span>Safe & verified</span>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
